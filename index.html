<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學英雄傳</title>
<style>
  :root { --g:#28a745; --gd:#1e7e34; --bg:#f4f7f6; --ink:#222; --mut:#666; --bad:#c0392b; --ok:#1e7e34; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Microsoft JhengHei","PingFang TC",sans-serif; line-height:1.6; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 60px; }
  .box { background:#fff; border-radius:20px; box-shadow:0 8px 22px rgba(0,0,0,.06); padding:32px; margin-bottom:22px; }
  h1,h2,h3 { margin:0 0 14px; color:var(--gd); }
  .center { text-align:center; }
  .hidden { display:none !important; }
  input[type=text], input[type=number], select { width:100%; font-size:1.15rem; padding:10px 14px; border:2px solid #cfd8d3; border-radius:12px; font-family:inherit; background:#fff; }
  input:focus, select:focus { outline:none; border-color:var(--g); }
  .row { display:flex; gap:12px; margin-bottom:12px; }
  .row > * { flex:1; }
  button { font-family:inherit; font-size:1.1rem; cursor:pointer; border:2px solid var(--g); background:#fff; color:var(--gd); padding:10px 18px; border-radius:999px; }
  button:hover { background:#eaf7ee; }
  button.pri { background:var(--g); color:#fff; }
  button.pri:hover { background:var(--gd); }
  button.full { width:100%; }
  .units { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .units .cell { display:flex; flex-direction:column; gap:6px; }
  .units .cell > button:first-child { flex:1; }
  .units button { border-radius:14px; padding:12px 10px; text-align:center; }
  .units button.hardbtn { border-color:#c0392b; color:#c0392b; padding:8px 10px; font-size:1rem; }
  .units button.hardbtn:hover { background:#fdecea; }
  .badge.hard { background:#c0392b; }
  .units small { display:block; color:var(--mut); font-size:.85rem; }
  .sticky { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 6px; }
  .track { height:16px; background:#e6ecef; border-radius:10px; position:relative; margin:6px 0 10px; }
  .bar { height:100%; width:0; background:var(--g); border-radius:10px; transition:width .3s; }
  .rocket { position:absolute; top:-16px; font-size:2rem; transition:left .3s; left:0; }
  .q { background:#fff; border-left:10px solid var(--g); border-radius:16px; padding:22px 26px; margin-bottom:20px; box-shadow:0 6px 16px rgba(0,0,0,.05); }
  .q h4 { margin:0 0 6px; color:var(--gd); }
  .qt { font-size:1.45rem; font-weight:700; margin:6px 0 14px; }
  .opt { display:block; padding:10px 14px; margin-bottom:8px; border:2px solid #dfe6e2; border-radius:12px; cursor:pointer; font-size:1.2rem; }
  .opt:hover { border-color:var(--g); background:#f3fbf5; }
  .opt input { margin-right:10px; transform:scale(1.3); }
  .opt.sel { border-color:var(--g); background:#eaf7ee; }
  .hint { color:var(--mut); font-size:.95rem; margin-top:6px; }
  .badge { display:inline-block; background:var(--g); color:#fff; padding:1px 12px; border-radius:999px; font-size:.95rem; margin-right:6px; }
  .score { font-size:4.5rem; font-weight:800; color:var(--g); }
  .rv { border-radius:14px; padding:14px 18px; margin-bottom:12px; border:1px solid; }
  .rv.ok { background:#e9f7ee; border-color:#bfe3c9; }
  .rv.no { background:#fdecea; border-color:#f3c3be; }
  .rv .mis { color:var(--bad); }
  .tag { font-size:.85rem; color:var(--mut); }
  table { width:100%; border-collapse:collapse; }
  th,td { padding:8px 10px; border-bottom:1px solid #e3e8e5; text-align:left; font-size:.98rem; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; color:var(--mut); }
  .linkbtn { border:none; background:none; color:var(--gd); text-decoration:underline; padding:4px 8px; font-size:1rem; }
  .roster { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:6px; }
  .roster button { text-align:left; padding:12px 18px; border-radius:14px; }
  .roster b { display:inline-block; min-width:3.2em; color:var(--mut); font-weight:600; }
  .note { color:var(--mut); font-size:.9rem; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="v-login" class="box center">
    <h1>🚀 數學國小 1–6 全年級　數學英雄傳</h1>
    <p class="hint">先選班級，再點選自己的座號和姓名開始闖關。成績會記錄給老師。每次開啟都需要重新選擇。</p>
    <div class="row">
      <select id="p-class">
        <option value="" disabled selected>選擇班級</option>
      </select>
    </div>
    <div id="roster" class="roster hidden"></div>
  </div>

  <div id="v-home" class="box hidden">
    <div class="topbar"><span id="who"></span><span><button class="linkbtn" id="btn-records">我的成績紀錄</button><button class="linkbtn" id="btn-logout">換人</button></span></div>
    <h2 class="center">🗺️ 選擇你的年級</h2>
    <select id="s-grade"></select>
    <div id="unit-area" class="hidden">
      <p style="margin:18px 0 0"><b>📍 點擊單元開始挑戰：</b></p>
      <div class="units" id="units"></div>
    </div>
  </div>

  <div id="v-quiz" class="hidden">
    <div class="sticky">
      <div class="track"><div class="bar" id="bar"></div><div class="rocket" id="rocket">🚀</div></div>
      <h3 class="center" id="u-title"></h3>
    </div>
    <div id="q-list"></div>
    <button class="pri full" id="btn-submit" style="padding:16px">完成測驗，送出答案！</button>
    <button class="full" id="btn-back1" style="margin-top:12px">↩️ 回單元清單</button>
  </div>

  <div id="v-result" class="box hidden">
    <div class="center">
      <h2>測驗結算</h2>
      <div class="score" id="r-score"></div>
      <p id="r-info" class="hint"></p>
    </div>
    <div id="r-weak"></div>
    <div id="r-detail" style="margin-top:18px"></div>
    <div class="row" style="margin-top:18px">
      <button class="pri" id="btn-retry-wrong">只重做錯題</button>
      <button class="pri" id="btn-retry-all">整份重考（題目重新洗牌）</button>
      <button id="btn-back2">🔄 挑戰其他單元</button>
    </div>
  </div>

  <div id="v-records" class="box hidden">
    <div class="topbar"><h2 style="margin:0">我的成績紀錄</h2><button class="linkbtn" id="btn-rec-back">↩️ 回地圖</button></div>
    <div id="rec-body"></div>
    <p class="note">這裡的紀錄只保存在這個瀏覽器；老師端另有完整紀錄。</p>
    <button id="btn-rec-clear" class="linkbtn">清除所有紀錄</button>
  </div>
</div>

<script src="questions.js"></script>
<script src="hard.js"></script>
<script src="roster.js"></script>
<script>
(function () {
  "use strict";
  // 成績回傳到老師的 Google 試算表（Apps Script 網頁應用程式）。留空字串則只存在本機。
  const BACKEND = 'https://script.google.com/macros/s/AKfycbz6-jx-OEZqJEn6hveqlfZILhd3mhcSrEFqv_19W2SMwGSLN_HVnt8FMzZvMTytvqMUEw/exec';
  // 每個瀏覽器分頁一個工作階段代號：同一分頁重新整理後再登入視為同一人；另一台電腦／另一個視窗則是不同代號
  const SID = (function () {
    try {
      let v = sessionStorage.getItem('mh_sid');
      if (!v) { v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); sessionStorage.setItem('mh_sid', v); }
      return v;
    } catch (e) { return String(Math.random()).slice(2) + Date.now(); }
  })();
  // 呼叫後端並讀取回應；網路失敗回傳空字串
  async function call(body, timeoutMs) {
    if (!BACKEND) return '';
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeoutMs || 8000);
    try {
      const r = await fetch(BACKEND, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ sid: SID }, body)), signal: ctl.signal });
      return (await r.text()).trim();
    } catch (e) { return ''; } finally { clearTimeout(tm); }
  }
  const $ = id => document.getElementById(id);
  const VIEWS = ['v-login', 'v-home', 'v-quiz', 'v-result', 'v-records'];
  const GRADES = ['1上','1下','2上','2下','3上','3下','4上','4下','5上','5下','6上','6下'];
  const CN = ['一','二','三','四','五','六'];
  const gname = g => CN[+g[0]-1] + '年級' + (g[1] === '上' ? '上學期' : '下學期');

  // ---------- 本機儲存（不可用時退化為記憶體） ----------
  const mem = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return mem[k] !== undefined ? mem[k] : d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; } }
  };

  let player = null; // 每次開啟都重新登入，不記住上一位學生
  const pid = () => player ? player.cls + '|' + player.seat : '';
  let isHard = false, isRetry = false, grade = '', unit = null, items = [], startedAt = 0, lastRun = null;

  function show(id) { VIEWS.forEach(v => $(v).classList.toggle('hidden', v !== id)); window.scrollTo(0, 0); }

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      if (k === 'class') e.className = props[k];
      else if (k === 'onclick') e.onclick = props[k];
      else e.setAttribute(k, props[k]);
    }
    kids.forEach(c => e.append(c));
    return e;
  }

  // ---------- 登入 / 首頁 ----------
  function renderRoster() {
    const cls = $('p-class').value, box = $('roster'); box.textContent = '';
    const list = (window.ROSTER && window.ROSTER[cls]) || [];
    list.forEach(([seat, name]) => {
      box.append(el('button', { onclick: () => login(cls, seat, name) }, el('b', null, seat + ' 號'), name));
    });
    box.classList.toggle('hidden', !list.length);
  }
  let beatTimer = null;
  function startBeat() {
    stopBeat();
    beatTimer = setInterval(async () => {
      if (!player) return;
      const res = await call({ action: 'beat', cls: player.cls, seat: player.seat, name: player.name });
      if (res === 'taken') { forceLogout('這位學生已在另一個視窗或另一台電腦登入，這裡已被登出。同一個姓名不能同時登入。'); }
    }, 45000);
  }
  function stopBeat() { if (beatTimer) { clearInterval(beatTimer); beatTimer = null; } }
  function forceLogout(msg) {
    stopBeat(); player = null;
    $('p-class').selectedIndex = 0; $('roster').classList.add('hidden'); show('v-login');
    alert(msg);
  }
  async function login(cls, seat, name) {
    const btns = document.querySelectorAll('#roster button'); btns.forEach(b => b.disabled = true);
    const res = await call({ action: 'login', cls, seat: String(seat), name });
    btns.forEach(b => b.disabled = false);
    if (res === 'busy') {
      alert('這位學生（' + cls + ' ' + seat + ' 號 ' + name + '）目前已在另一個視窗或另一台電腦登入。同一個姓名不能同時登入。如果是你自己，請先關掉另一個視窗，或等 2 分鐘後再試。');
      return;
    }
    player = { name, cls, seat: String(seat) };
    startBeat();
    goHome();
  }
  function leave() {
    if (!player) return;
    try { navigator.sendBeacon(BACKEND, JSON.stringify({ action: 'bye', sid: SID, cls: player.cls, seat: player.seat })); } catch (e) { /* 忽略 */ }
  }
  window.addEventListener('pagehide', leave);
  function goHome() {
    $('who').textContent = '👤 ' + player.cls + ' ' + player.seat + ' 號　' + player.name;
    $('s-grade').selectedIndex = 0;
    $('unit-area').classList.add('hidden');
    show('v-home');
  }
  function best(g, u, hard) {
    let b = null;
    store.get('mh_records', []).forEach(r => { if (r.p === pid() && r.g === g && r.u === u && !!r.h === !!hard && (b === null || r.s > b)) b = r.s; });
    return b;
  }
  function loadUnits() {
    grade = $('s-grade').value;
    const box = $('units'); box.textContent = '';
    (window.QB[grade] || []).forEach((u, i) => {
      const b = best(grade, u.unit, false);
      const cell = el('div', { class: 'cell' },
        el('button', { onclick: () => startUnit(u, false) }, u.unit, el('small', null, b === null ? '尚未挑戰' : '最高 ' + b + ' 分')));
      const hu = window.HQB && window.HQB[grade] && window.HQB[grade][i];
      if (hu) {
        const hb = best(grade, u.unit, true);
        cell.append(el('button', { class: 'hardbtn', onclick: () => startUnit(hu, true) }, '🔥 難題測驗', el('small', null, hb === null ? '尚未挑戰' : '最高 ' + hb + ' 分')));
      }
      box.append(cell);
    });
    $('unit-area').classList.remove('hidden');
  }

  // ---------- 出題 ----------
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function parseOpts(h) {
    const o = []; const re = /\(([A-D])\)\s*([\s\S]*?)(?=\s*\([A-D]\)|$)/g; let m;
    while ((m = re.exec(h))) o.push({ k: m[1], t: m[2].trim() });
    return o;
  }
  function parseMisc(s) {
    const map = []; // {keys:[], text}
    (s || '').split(/[;；]/).forEach(p => {
      const i = p.indexOf('='); if (i < 0) return;
      map.push({ keys: p.slice(0, i).split(/[,，]/).map(x => x.trim()), text: p.slice(i + 1).trim() });
    });
    return map;
  }
  function mkItem(raw) {
    const [type, q, hint, ans, exp, concept, misc] = raw;
    const it = { raw, type, q, hint, ans, exp, concept, misc: parseMisc(misc) };
    if (type === '選擇') {
      let opts = parseOpts(hint);
      const fixed = opts.some(o => /都對|都不對|以上|上述|皆|兩個/.test(o.t));
      if (!fixed) opts = shuffle(opts);
      it.opts = opts; // 每個選項保留原字母 k 供對照迷思概念
    }
    return it;
  }
  function startUnit(u, hard) {
    unit = u; isRetry = false; isHard = !!hard;
    items = u.qs.map(mkItem);
    renderQuiz();
  }

  function renderQuiz() {
    $('u-title').textContent = '';
    $('u-title').append(el('span', { class: 'badge' }, grade), isHard ? el('span', { class: 'badge hard' }, '難題') : '', unit.unit);
    const list = $('q-list'); list.textContent = '';
    items.forEach((it, i) => {
      const card = el('div', { class: 'q' }, el('h4', null, '第 ' + (i + 1) + ' 題　[' + it.type + ']'), el('div', { class: 'qt' }, it.q));
      if (it.type === '選擇') {
        it.opts.forEach((o, j) => {
          const lab = el('label', { class: 'opt' });
          const r = el('input', { type: 'radio', name: 'a' + i, value: String(j) });
          r.onchange = () => { card.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); lab.classList.add('sel'); progress(); };
          lab.append(r, String.fromCharCode(65 + j) + '． ' + o.t);
          card.append(lab);
        });
      } else {
        const inp = el('input', { type: 'text', id: 'a' + i, autocomplete: 'off', placeholder: '在這裡輸入答案' });
        inp.oninput = progress;
        card.append(inp, el('div', { class: 'hint' }, '💡 ' + it.hint));
      }
      list.append(card);
    });
    startedAt = Date.now();
    progress(); show('v-quiz');
  }
  function answered(i) {
    const it = items[i];
    if (it.type === '選擇') return !!document.querySelector('input[name=a' + i + ']:checked');
    return $('a' + i).value.trim() !== '';
  }
  function progress() {
    let d = 0; items.forEach((_, i) => { if (answered(i)) d++; });
    const p = items.length ? d / items.length * 100 : 0;
    $('bar').style.width = p + '%';
    $('rocket').style.left = 'calc(' + p + '% - 30px)';
  }

  // ---------- 判分 ----------
  const nfkc = s => String(s).normalize('NFKC').replace(/[\s,，]/g, '').toLowerCase();
  function judge(it, ua) {
    const a = nfkc(it.ans), u = nfkc(ua);
    if (u === a) return true;
    // 答案為「數字＋單位」：只輸入數字也算對
    const m = it.ans.normalize('NFKC').match(/^(-?\d[\d.,]*(?:\/\d+)?)\s*([^\d\s/.,]+)?$/);
    if (m) {
      const num = nfkc(m[1]), unitS = m[2] ? nfkc(m[2]) : '';
      if (u === num) return true;
      if (unitS && u === num + unitS) return true;
      if (/^-?[\d.]+$/.test(num) && /^-?[\d.]+$/.test(u) && parseFloat(num) === parseFloat(u)) return true;
    }
    return false;
  }
  function misconception(it, key, ua) {
    for (const m of it.misc) if (key && m.keys.includes(key)) return m.text;
    const nu = ua ? nfkc(ua) : '';
    for (const m of it.misc) if (nu && m.keys.some(k => k !== '*' && nfkc(k) === nu)) return m.text;
    const w = it.misc.find(m => m.keys.includes('*'));
    return w ? w.text : '';
  }

  function submit() {
    const unanswered = items.filter((_, i) => !answered(i)).length;
    if (unanswered && !confirm('還有 ' + unanswered + ' 題沒作答，確定要送出嗎？')) return;
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    const dur = Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    const per = 100 / items.length;
    let right = 0; const details = []; const wrong = []; const detail = $('r-detail'); detail.textContent = '';
    items.forEach((it, i) => {
      let ok, shown, correct, mis = '';
      if (it.type === '選擇') {
        const c = document.querySelector('input[name=a' + i + ']:checked');
        const pick = c ? it.opts[+c.value] : null;
        ok = !!pick && pick.k === it.ans;
        shown = pick ? String.fromCharCode(65 + +c.value) + '． ' + pick.t : '（未作答）';
        if (!ok && pick) mis = misconception(it, pick.k, '');
        correct = (function () { const j = it.opts.findIndex(o => o.k === it.ans); return j < 0 ? it.ans : String.fromCharCode(65 + j) + '． ' + it.opts[j].t; })();
      } else {
        const ua = $('a' + i).value.trim();
        ok = judge(it, ua);
        shown = ua || '（未作答）';
        if (!ok && ua) mis = misconception(it, '', ua);
        correct = it.ans;
      }
      if (ok) right++; else wrong.push(it);
      details.push({ no: i + 1, type: it.type, q: it.q, ua: shown, ca: correct, ok: ok ? 1 : 0, concept: it.concept, misc: mis });
      const rv = el('div', { class: 'rv ' + (ok ? 'ok' : 'no') },
        el('b', null, (ok ? '✅ 正確' : '❌ 錯誤') + '　第 ' + (i + 1) + ' 題'), el('span', { class: 'tag' }, it.concept ? '　概念：' + it.concept : ''),
        el('div', null, it.q));
      if (!ok) rv.append(el('div', null, '你的答案：' + shown));
      rv.append(el('div', null, '正解：', el('b', null, correct)));
      if (mis) rv.append(el('div', { class: 'mis' }, '可能的迷思：' + mis));
      if (it.exp) rv.append(el('div', { class: 'tag' }, '解析：' + it.exp));
      detail.append(rv);
    });
    const score = Math.round(right * per);
    $('r-score').textContent = score + ' 分';
    $('r-info').textContent = '答對 ' + right + ' / ' + items.length + ' 題　⏱️ ' + dur;
    // 弱點概念
    const wk = {}; wrong.forEach(w => { if (w.concept) wk[w.concept] = (wk[w.concept] || 0) + 1; });
    const wp = $('r-weak'); wp.textContent = '';
    const ks = Object.keys(wk);
    if (ks.length) wp.append(el('p', null, el('b', null, '📌 建議複習的概念：'), ks.join('、')));
    $('btn-retry-wrong').classList.toggle('hidden', wrong.length === 0);
    lastRun = { wrong };
    // 完整單元的第一次作答才寫入成績紀錄（錯題重做不覆蓋最高分）
    const NOW = Date.now();
    if (!isRetry) sendLog({ action: 'log', name: player.name, cls: player.cls, seat: player.seat, grade: grade, unit: unit.unit + (isHard ? '（難題）' : ''), hard: isHard ? 1 : 0, score: score, right: right, total: items.length, duration: dur, seconds: sec, t: NOW });
    if (!isRetry) saveRecord({ t: NOW, p: pid(), g: grade, u: unit.unit, h: isHard ? 1 : 0, s: score, r: right, n: items.length, d: dur, wk: ks });
    show('v-result');
  }
  async function sendLog(payload) {
    if (!BACKEND) return;
    const res = await call(payload, 15000);
    if (res !== 'ok' && res !== 'invalid') {   // 網路失敗、或後端暫時壞掉：先暫存，下次開啟網頁時補送
      const q = store.get('mh_unsent', []); q.push(payload); store.set('mh_unsent', q.slice(-50)); return;
    }
    if (res === 'invalid') {
      const arr = store.get('mh_records', []);          // 這次成績不列入，連本機紀錄一起移除
      for (let i = arr.length - 1; i >= 0; i--) { if (arr[i].t === payload.t) { arr.splice(i, 1); break; } }
      store.set('mh_records', arr);
      alert('偵測到同一個姓名同時在另一個視窗或電腦登入，這次成績不列入紀錄。');
    }
  }
  function flushUnsent() {
    const q = store.get('mh_unsent', []); if (!q.length || !BACKEND) return;
    store.set('mh_unsent', []); q.forEach(sendLog);
  }
  function saveRecord(r) {
    const arr = store.get('mh_records', []); arr.push(r);
    store.set('mh_records', arr.slice(-300));
  }

  function retryWrong() {
    items = shuffle(lastRun.wrong).map(w => mkItem(w.raw));
    isRetry = true;
    renderQuiz();
  }
  function retryAll() { startUnit(unit, isHard); }

  // ---------- 成績紀錄 ----------
  function showRecords() {
    const body = $('rec-body'); body.textContent = '';
    const rs = store.get('mh_records', []).filter(r => r.p === pid()).reverse();
    if (!rs.length) { body.append(el('p', null, '還沒有紀錄，快去挑戰吧！')); show('v-records'); return; }
    const t = el('table', null, el('tr', null, ...['時間', '年級', '單元', '分數', '答對', '用時'].map(h => el('th', null, h))));
    rs.forEach(r => {
      const d = new Date(r.t);
      t.append(el('tr', null, ...[d.getMonth() + 1 + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), r.g, r.u + (r.h ? '（難題）' : ''), r.s + ' 分', r.r + '/' + r.n, r.d].map(x => el('td', null, x))));
    });
    body.append(t); show('v-records');
  }

  // ---------- 事件 ----------
  GRADES.forEach(g => $('s-grade').append(el('option', { value: g }, gname(g))));
  $('s-grade').insertBefore(el('option', { value: '', disabled: 'disabled', selected: 'selected' }, '請選擇年級…'), $('s-grade').firstChild);
  Object.keys(window.ROSTER || {}).forEach(c => $('p-class').append(el('option', { value: c }, c)));
  $('p-class').onchange = renderRoster;
  $('s-grade').onchange = loadUnits;
  $('btn-submit').onclick = submit;
  $('btn-back1').onclick = () => { if (confirm('離開會放棄目前作答，確定嗎？')) goHome(); };
  $('btn-back2').onclick = goHome;
  $('btn-retry-wrong').onclick = retryWrong;
  $('btn-retry-all').onclick = retryAll;
  $('btn-records').onclick = showRecords;
  $('btn-rec-back').onclick = goHome;
  $('btn-rec-clear').onclick = () => { if (confirm('確定清除所有成績紀錄？')) { store.set('mh_records', []); showRecords(); } };
  $('btn-logout').onclick = () => { leave(); stopBeat(); player = null; $('p-class').selectedIndex = 0; $('roster').classList.add('hidden'); show('v-login'); };

  flushUnsent();
  show('v-login');
})();
</script>
</body>
</html>
